name: Build Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            artifact: BacklogTracker-linux
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage

          - name: Windows
            os: windows-latest
            artifact: BacklogTracker-windows
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

          - name: macOS
            os: macos-latest
            artifact: BacklogTracker-macos
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop application
        run: npm run tauri:build

      - name: Fix AppImage launcher permissions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage_dir="src-tauri/target/release/bundle/appimage"
          appimage="$(find "$appimage_dir" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"

          # Some Tauri AppImage builds lose the executable bit on AppRun and
          # AppRun.wrapped. Restore both before repacking for catalog testers.
          chmod +x "$appimage"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          (cd "$work_dir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          chmod 755 "$work_dir/squashfs-root/AppRun" "$work_dir/squashfs-root/AppRun.wrapped"

          curl -fsSL \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$work_dir/appimagetool.AppImage"
          chmod +x "$work_dir/appimagetool.AppImage"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            "$work_dir/appimagetool.AppImage" \
            "$work_dir/squashfs-root" "$work_dir/fixed.AppImage"
          chmod +x "$work_dir/fixed.AppImage"
          mv "$work_dir/fixed.AppImage" "$appimage"

          # Fail the build if repacking ever drops either launcher permission.
          mkdir "$work_dir/verify"
          (cd "$work_dir/verify" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          test -x "$work_dir/verify/squashfs-root/AppRun"
          test "$(stat -c '%a' "$work_dir/verify/squashfs-root/AppRun.wrapped")" = 755

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BacklogTracker-*
          merge-multiple: true
          path: release-packages

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-packages/**/*.deb
            release-packages/**/*.rpm
            release-packages/**/*.AppImage
            release-packages/**/*.msi
            release-packages/**/*.exe
            release-packages/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
