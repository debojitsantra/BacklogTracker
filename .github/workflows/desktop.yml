name: Build Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Build Linux Desktop App
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build desktop app
        run: pake ./dist/index.html --name "Backlog Tracker" --width 900 --height 700 --use-local-file --icon ./public/app_logo.png

      - name: Collect Linux artifacts
        shell: bash
        run: |
          mkdir -p desktop-artifacts
          find . -maxdepth 8 -type f \( -name "*.AppImage" -o -name "*.deb" \) -not -path "./node_modules/*" -exec cp {} desktop-artifacts/ \;

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: BacklogTracker-linux
          path: desktop-artifacts/*
          if-no-files-found: error

  windows:
    name: Build Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build desktop app
        run: pake ./dist/index.html --name "Backlog Tracker" --width 900 --height 700 --use-local-file --icon ./public/app_logo.png

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-artifacts
          Get-ChildItem -Recurse -File -Include *.msi |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' } |
            Copy-Item -Destination desktop-artifacts

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BacklogTracker-windows
          path: desktop-artifacts/*
          if-no-files-found: error

  macos:
    name: Build macOS Desktop App
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build desktop app
        run: pake ./dist/index.html --name "Backlog Tracker" --width 900 --height 700 --use-local-file --icon ./public/app_logo.png

      - name: Collect macOS artifacts
        shell: bash
        run: |
          mkdir -p desktop-artifacts
          find . -maxdepth 8 -type f -name "*.dmg" -not -path "./node_modules/*" -exec cp {} desktop-artifacts/ \;

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BacklogTracker-macos
          path: desktop-artifacts/*
          if-no-files-found: error

  release:
    name: Upload Desktop Release Assets
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: BacklogTracker-*
          merge-multiple: true

      - name: Extract desktop release packages
        shell: bash
        run: |
          mkdir -p release-packages
          find release-artifacts -type f \( \
            -name "*.msi" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.dmg" \
          \) -exec cp {} release-packages/ \;

          test -n "$(find release-packages -maxdepth 1 -type f -print -quit)"

      - name: Upload packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-packages/*.msi
            release-packages/*.deb
            release-packages/*.AppImage
            release-packages/*.dmg
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
